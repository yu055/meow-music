<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>猫叫交响曲</title>
<style>
  :root{
    --bg1:#FFF6EC; --bg2:#FFE4CE; --accent:#FF8A3D; --accent2:#FFB36B;
    --ink:#2B2730; --sub:#8C8594; --card:#FFFFFF; --line:#EADFD3;
    --ok:#3DBE7A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"PingFang SC","Segoe UI",system-ui,sans-serif;
    background:#d9cdbf; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  /* 移动端竖屏：手机上铺满，桌面上以 390×844 机身呈现 */
  .phone{
    position:relative; width:390px; height:844px; overflow:hidden;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    border-radius:44px; box-shadow:0 24px 70px rgba(0,0,0,.35);
  }
  @media (max-width:430px){
    body{background:var(--bg1)}
    .phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}
  }

  /* 屏切换 */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;
    padding:56px 24px 32px;opacity:0;transition:opacity .35s}
  .screen.active{display:flex;opacity:1}

  h1{font-size:26px;font-weight:800;letter-spacing:.5px}
  .sub{color:var(--sub);font-size:14px;margin-top:8px;line-height:1.6}
  .spacer{flex:1}

  .btn{
    width:100%;height:54px;border:none;border-radius:16px;
    background:var(--accent);color:#fff;font-size:17px;font-weight:700;
    box-shadow:0 10px 24px rgba(255,138,61,.4);cursor:pointer;
    transition:transform .12s,opacity .2s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:#fff;color:var(--accent);box-shadow:none;border:1.5px solid var(--accent)}
  .btn[disabled]{opacity:.45;box-shadow:none}

  /* 1. 上传 */
  .hero{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:40px}
  .cat-badge{width:140px;height:140px;border-radius:50%;
    background:radial-gradient(circle at 50% 38%,#fff,#FFE1C4);
    display:flex;align-items:center;justify-content:center;font-size:74px;
    box-shadow:0 14px 34px rgba(255,138,61,.28)}
  .drop{margin-top:10px;width:100%;border:2px dashed var(--accent2);border-radius:20px;
    padding:26px;text-align:center;color:var(--sub);background:rgba(255,255,255,.5)}
  .drop b{color:var(--accent)}
  .filelist{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .fileitem{background:#fff;border-radius:12px;padding:12px 14px;font-size:14px;
    display:flex;align-items:center;gap:10px;box-shadow:0 4px 12px rgba(0,0,0,.05)}

  /* 2. 加载 */
  .loader{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
  .spin{font-size:66px;animation:bob 1.1s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}

  /* 3. 音符审核：五线谱 */
  .staff{position:relative;margin-top:28px;height:220px;background:#fff;border-radius:20px;
    box-shadow:0 8px 22px rgba(0,0,0,.06);overflow:hidden}
  .staff .ln{position:absolute;left:16px;right:16px;height:1.5px;background:var(--line)}
  .staff .clef{position:absolute;left:18px;top:50%;transform:translateY(-54%);font-size:62px;color:var(--ink);opacity:.8}
  .note{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
    background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px rgba(255,138,61,.45);
    transition:transform .15s,opacity .3s}
  .note:active{transform:scale(1.18)}
  .note.playing{background:var(--ok);box-shadow:0 6px 16px rgba(61,190,122,.5)}
  .note .x{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;
    background:#fff;color:var(--accent);font-size:13px;line-height:20px;text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .note.gone{opacity:0;transform:scale(.3)}
  .hint{text-align:center;color:var(--sub);font-size:13px;margin-top:16px}

  /* 4. 风格 */
  .genres{margin-top:24px;display:flex;flex-direction:column;gap:14px}
  .gcard{background:#fff;border-radius:18px;padding:18px;display:flex;align-items:center;gap:14px;
    box-shadow:0 8px 20px rgba(0,0,0,.06);cursor:pointer;border:2px solid transparent;transition:border .2s,transform .12s}
  .gcard:active{transform:scale(.98)}
  .gcard.sel{border-color:var(--accent)}
  .gcard .emo{font-size:30px}
  .gcard .meta{flex:1}
  .gcard .nm{font-size:17px;font-weight:700}
  .gcard .bpm{font-size:12px;color:var(--sub);margin-top:2px}
  .fit{font-size:12px;font-weight:700;color:var(--accent);background:#FFF0E3;
    padding:5px 10px;border-radius:999px}

  /* 5. 播放：黑胶 + 猫爪 */
  .player{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
  .vinyl-wrap{position:relative;width:260px;height:260px}
  .vinyl{width:260px;height:260px;border-radius:50%;
    background:repeating-radial-gradient(circle at 50% 50%,#222 0 3px,#1a1a1a 3px 6px);
    box-shadow:0 18px 40px rgba(0,0,0,.4);animation:spin 4s linear infinite;animation-play-state:paused}
  .vinyl.on{animation-play-state:running}
  .vinyl .label{position:absolute;inset:88px;border-radius:50%;
    background:radial-gradient(circle at 50% 40%,var(--accent2),var(--accent));
    display:flex;align-items:center;justify-content:center;font-size:40px}
  .vinyl .hole{position:absolute;inset:124px;border-radius:50%;background:#FFF6EC}
  @keyframes spin{to{transform:rotate(360deg)}}
  .paw{position:absolute;right:-6px;top:30px;font-size:60px;transform-origin:80% 20%;
    transform:rotate(-28deg);transition:transform .4s ease}
  .paw.on{transform:rotate(4deg)}
  .controls{display:flex;align-items:center;gap:26px}
  .play{width:76px;height:76px;border-radius:50%;border:none;background:var(--accent);color:#fff;
    font-size:30px;box-shadow:0 12px 28px rgba(255,138,61,.45);cursor:pointer}
  .round{width:54px;height:54px;border-radius:50%;border:none;background:#fff;color:var(--accent);
    font-size:22px;box-shadow:0 6px 16px rgba(0,0,0,.08);cursor:pointer}

  .topbar{position:absolute;top:18px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between}
  .back{font-size:20px;color:var(--sub);cursor:pointer;background:none;border:none}
  .toast{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);
    background:rgba(43,39,48,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;
    opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:1}

  /* ---- 0. Splash ---- */
  #s-splash{padding:0;background:#1E0B4E;}
  .splash-fg{
    position:absolute;inset:0;z-index:10;
    display:flex;flex-direction:column;
    padding:64px 28px 44px;
  }
  .meow-logo{
    font-size:58px;font-weight:900;font-style:italic;
    color:#F5D63A;line-height:1;letter-spacing:-2px;
  }
  .splash-mid{
    flex:1;display:flex;align-items:center;justify-content:center;
  }
  .splash-cat-ph{font-size:108px;line-height:1;filter:drop-shadow(0 12px 28px rgba(0,0,0,.5));}
  .splash-tag{
    color:rgba(255,255,255,.65);font-size:14px;
    text-align:center;margin-bottom:20px;letter-spacing:.3px;
  }
  .btn-start{
    width:100%;height:58px;border-radius:999px;border:none;
    background:#EDE0B8;color:#1E0B4E;
    font-size:17px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 10px 0 28px;transition:opacity .15s;
  }
  .btn-start:active{opacity:.85;}
  .start-arr{
    width:40px;height:40px;border-radius:50%;flex-shrink:0;
    background:#1E0B4E;color:#EDE0B8;
    display:flex;align-items:center;justify-content:center;font-size:17px;
  }
</style>
</head>
<body>
<div class="phone">

  <!-- 0. Splash -->
  <section class="screen active" id="s-splash">
    <div id="driftbg" style="position:absolute;inset:0;z-index:0;overflow:hidden;"></div>
    <div class="splash-fg">
      <div class="meow-logo">MEOW<br>MUSIC.</div>
      <div class="splash-mid">
        <div class="splash-cat-ph">🐱</div>
      </div>
      <p class="splash-tag">把猫叫变成一段音乐</p>
      <button class="btn-start" onclick="go('s-upload')">
        <span>Get Started</span>
        <span class="start-arr">↗</span>
      </button>
    </div>
  </section>

  <!-- 1. 上传 -->
  <section class="screen" id="s-upload">
    <h1>猫叫交响曲</h1>
    <p class="sub">上传一段有猫叫的录音，<br>我们把它谱成专属小曲 🎵</p>
    <div class="hero">
      <div class="cat-badge">🐱</div>
    </div>
    <label class="drop" for="file">
      点击选择音频 / 视频　<b>可多选</b><br>
      <span style="font-size:12px">支持 mp3 · m4a · wav · mp4，最长 60s</span>
    </label>
    <input id="file" type="file" accept="audio/*,video/*" multiple hidden>
    <div class="filelist" id="filelist"></div>
    <div class="spacer"></div>
    <button class="btn" id="btn-analyze" disabled>开始分析</button>
  </section>

  <!-- 2. 分析中 -->
  <section class="screen" id="s-analyzing">
    <div class="loader">
      <div class="spin">🐱</div>
      <div style="font-weight:700;font-size:18px">正在聆听你的猫…</div>
      <div class="sub" style="text-align:center">降噪 · 提取猫叫 · 识别音高</div>
    </div>
  </section>

  <!-- 3. 音符审核 -->
  <section class="screen" id="s-notes">
    <div class="topbar"><button class="back" data-go="s-upload">‹</button></div>
    <h1 style="margin-top:10px">审核音符</h1>
    <p class="sub">点音符试听这一声猫叫，不想要的点 × 去掉</p>
    <div class="staff" id="staff">
      <div class="clef">𝄞</div>
    </div>
    <p class="hint" id="notecount"></p>
    <div class="spacer"></div>
    <button class="btn" id="btn-togenre">选择风格 ›</button>
  </section>

  <!-- 4. 风格选择 -->
  <section class="screen" id="s-genre">
    <div class="topbar"><button class="back" data-go="s-notes">‹</button></div>
    <h1 style="margin-top:10px">挑一种风格</h1>
    <p class="sub">按与你家猫的适配度排序，点一下即生成</p>
    <div class="genres" id="genres"></div>
    <div class="spacer"></div>
  </section>

  <!-- 5. 播放 -->
  <section class="screen" id="s-player">
    <div class="topbar">
      <button class="back" data-go="s-genre">‹</button>
      <span class="sub" id="nowgenre"></span>
    </div>
    <div class="player">
      <div class="vinyl-wrap">
        <div class="vinyl" id="vinyl">
          <div class="label">🐾</div>
          <div class="hole"></div>
        </div>
        <div class="paw" id="paw">🐾</div>
      </div>
      <div class="controls">
        <button class="round" id="btn-regen" title="重新生成">↻</button>
        <button class="play" id="btn-play">▶</button>
        <button class="round" id="btn-share" title="分享">⤴</button>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>
</div>

<audio id="preview"></audio>
<audio id="main"></audio>

<script>
const $ = s => document.querySelector(s);
const api = (p,o) => fetch(p,o).then(async r=>{if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.status);return r.json();});
let state = { sid:null, segments:[], dismissed:new Set(), genre:null };

function go(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $('#'+id).classList.add('active'); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); }
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));

/* ---- 1. 上传 ---- */
const fileInput = $('#file');
let chosen = [];
fileInput.onchange = () => {
  chosen = [...fileInput.files];
  $('#filelist').innerHTML = chosen.map(f=>`<div class="fileitem">🎵 ${f.name}</div>`).join('');
  $('#btn-analyze').disabled = chosen.length===0;
};
$('#btn-analyze').onclick = async () => {
  go('s-analyzing');
  try{
    const fd = new FormData();
    chosen.forEach(f=>fd.append('files', f));
    const up = await api('/upload',{method:'POST',body:fd});
    state.sid = up.session_id;
    const res = await api('/analyze/'+state.sid,{method:'POST'});
    state.segments = res.segments;
    state.recommendations = res.recommendations;
    state.dismissed = new Set();
    renderNotes(); renderGenres();
    go('s-notes');
  }catch(e){ toast('分析失败：'+e.message); go('s-upload'); }
};

/* ---- 3. 音符审核 ---- */
function midiToY(midi){
  // 五线谱可视映射：E4(64)底线 ~ F5(77)顶线，范围外夹紧并留边距
  const lo=59, hi=81, top=40, bot=180;
  const r=Math.max(0,Math.min(1,(midi-lo)/(hi-lo)));
  return bot-(bot-top)*r;
}
function renderNotes(){
  const staff=$('#staff');
  staff.querySelectorAll('.ln,.note').forEach(n=>n.remove());
  for(let i=0;i<5;i++){ const ln=document.createElement('div'); ln.className='ln'; ln.style.top=(60+i*24)+'px'; staff.appendChild(ln); }
  const live=state.segments.filter(s=>!state.dismissed.has(s.id));
  const n=live.length, L=70, R=360;
  live.forEach((seg,i)=>{
    const el=document.createElement('div'); el.className='note';
    el.style.left=(L+(R-L)*(n<=1?0.5:i/(n-1)))+'px';
    el.style.top=midiToY(seg.pitch)+'px';
    el.innerHTML=`${seg.pitch_name}<span class="x">×</span>`;
    el.querySelector('.x').onclick=(e)=>{e.stopPropagation();dismiss(seg.id,el);};
    el.onclick=()=>playSeg(seg,el);
    staff.appendChild(el);
  });
  $('#notecount').textContent=`保留 ${n} / ${state.segments.length} 声猫叫`;
  $('#btn-togenre').disabled = n===0;
}
function dismiss(id,el){ el.classList.add('gone'); state.dismissed.add(id); setTimeout(renderNotes,300); }
function playSeg(seg,el){
  const a=$('#preview'); a.src=seg.audio_url; a.play();
  document.querySelectorAll('.note').forEach(x=>x.classList.remove('playing'));
  el.classList.add('playing'); a.onended=()=>el.classList.remove('playing');
}
$('#btn-togenre').onclick=()=>go('s-genre');

/* ---- 4. 风格 ---- */
const EMO={jazz:'🎷',folk:'🪕',rb:'🎹',march:'🥁',lofi:'🌙',classical:'🎻'};
function renderGenres(){
  $('#genres').innerHTML='';
  state.recommendations.forEach(g=>{
    const c=document.createElement('div'); c.className='gcard'; c.dataset.key=g.key;
    c.innerHTML=`<div class="emo">${EMO[g.key]||'🎵'}</div>
      <div class="meta"><div class="nm">${g.label}</div><div class="bpm">BPM ${g.bpm}</div></div>
      <div class="fit">适配 ${Math.round(g.fit*100)}%</div>`;
    c.onclick=()=>pickGenre(g);
    $('#genres').appendChild(c);
  });
}
async function pickGenre(g){
  state.genre=g;
  document.querySelectorAll('.gcard').forEach(c=>c.classList.toggle('sel',c.dataset.key===g.key));
  go('s-analyzing'); $('#s-analyzing').querySelector('div[style*="font-weight"]').textContent='正在谱曲…';
  try{ await doGenerate(); go('s-player'); }
  catch(e){ toast('生成失败：'+e.message); go('s-genre'); }
}
async function doGenerate(){
  const keep=state.segments.filter(s=>!state.dismissed.has(s.id)).map(s=>s.id).join(',');
  const g=state.genre;
  const res=await api(`/generate/${state.sid}?genre=${g.key}&keep=${encodeURIComponent(keep)}`,{method:'POST'});
  $('#main').src=res.mp3_url+'?t='+Date.now();
  $('#nowgenre').textContent=`${res.genre_label} · ${res.duration}s`;
  resetPlayer();
}

/* ---- 5. 播放 ---- */
const main=$('#main'), vinyl=$('#vinyl'), paw=$('#paw'), btnPlay=$('#btn-play');
function resetPlayer(){ main.pause(); main.currentTime=0; setPlaying(false); }
function setPlaying(on){
  vinyl.classList.toggle('on',on); paw.classList.toggle('on',on);
  btnPlay.textContent=on?'❚❚':'▶';
}
btnPlay.onclick=()=>{ if(main.paused){main.play();setPlaying(true);}else{main.pause();setPlaying(false);} };
main.onended=()=>setPlaying(false);
$('#btn-regen').onclick=async()=>{ go('s-genre'); };
$('#btn-share').onclick=()=>toast('分享卡片开发中…');

/* ---- DriftWall ---- */
class DriftWall {
  constructor(el, opts={}) {
    this.el = el;
    this.o = {
      items:[], columns:3, tileW:115, tileH:115, gap:10,
      tilt:16, turn:-14, perspective:1200, depth:70,
      speed:38, variance:0.42,
      overlayColor:'#1E0B4E', fade:0.62, dim:0.52, lift:50,
      ...opts
    };
    this.cols = [];
    this._build();
    this._tick = this._tick.bind(this);
    requestAnimationFrame(this._tick);
  }

  _build() {
    const o = this.o;
    const H = this.el.offsetHeight || 844;
    const step = o.tileH + o.gap;
    const nTiles = Math.ceil((H + o.lift*2) / step) + 4;
    const wallW = o.columns*(o.tileW+o.gap) - o.gap;

    const root = document.createElement('div');
    root.style.cssText = `position:absolute;inset:-${o.lift}px;
      perspective:${o.perspective}px;perspective-origin:50% 42%;overflow:visible;`;

    const stage = document.createElement('div');
    const ml = -(wallW/2) + (o.adjustX||0);
    stage.style.cssText = `position:absolute;left:50%;top:0;bottom:0;
      width:${wallW}px;margin-left:${ml}px;
      transform:rotateX(${o.tilt}deg) rotateY(${o.turn}deg);
      transform-style:preserve-3d;`;

    for (let c=0; c<o.columns; c++) {
      const zOff = o.columns>1 ? (c/(o.columns-1)-0.5)*o.depth : 0;
      const spd  = o.speed*(1+(Math.random()*2-1)*o.variance)/60;
      const colEl = document.createElement('div');
      colEl.style.cssText = `position:absolute;left:${c*(o.tileW+o.gap)}px;top:0;
        width:${o.tileW}px;transform:translateZ(${zOff}px);transform-style:preserve-3d;`;

      const tiles = [];
      for (let t=0; t<nTiles; t++) {
        const item = o.items[(c + t*o.columns) % o.items.length];
        const y = t*step - step*2;
        const tEl = document.createElement('div');
        tEl.style.cssText = `position:absolute;top:0;left:0;
          width:${o.tileW}px;height:${o.tileH}px;
          border-radius:12px;overflow:hidden;
          transform:translateY(${y}px);will-change:transform;`;
        const img = document.createElement('img');
        img.src = typeof item==='string' ? item : (item.src||item.image||'');
        img.alt = ''; img.draggable = false;
        img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
        tEl.appendChild(img); colEl.appendChild(tEl);
        tiles.push({el:tEl, y});
      }
      stage.appendChild(colEl);
      this.cols.push({tiles, spd, step, tileH:o.tileH});
    }

    root.appendChild(stage);
    this.el.appendChild(root);

    // dim overlay
    const dim = document.createElement('div');
    dim.style.cssText = `position:absolute;inset:0;z-index:1;pointer-events:none;
      background:${o.overlayColor};opacity:${o.dim};`;
    this.el.appendChild(dim);

    // top/bottom fade
    const fs = Math.round(o.fade*28+2);
    const fade = document.createElement('div');
    fade.style.cssText = `position:absolute;inset:0;z-index:2;pointer-events:none;
      background:linear-gradient(to bottom,
        ${o.overlayColor} 0%,transparent ${fs}%,
        transparent ${100-fs}%,${o.overlayColor} 100%);`;
    this.el.appendChild(fade);
  }

  _tick() {
    this.cols.forEach(col => {
      let maxY = -Infinity;
      col.tiles.forEach(t => { if(t.y > maxY) maxY = t.y; });
      col.tiles.forEach(t => {
        t.y -= col.spd;
        if (t.y + col.tileH < -(this.o.lift*2+50)) {
          t.y = maxY + col.step;
          maxY = t.y;
        }
        t.el.style.transform = `translateY(${t.y}px)`;
      });
    });
    requestAnimationFrame(this._tick);
  }
}

/* 猫版专辑封面 (8张) + picsum 补位 */
const ALBUMS = [
  'images/01-sos.png',
  'images/02-guitar.png',
  'images/03-black.png',
  'images/04-starboy.png',
  'images/05-twice.png',
  'images/06-ariana.png',
  'images/07-ditto.png',

class ScrambledText {
  constructor(el, opts = {}) {
    this.el = el;
    this.o = {
      scrambleChars: '.:', duration: 1.2, speed: 0.5,
      trail: 0.6, strength: 1, radius: 100,
      intro: true, clickBurst: true, ...opts
    };
    this.chars = [];
    this._build();
    this._bindEvents();
    this._loop();
    if (this.o.intro) setTimeout(() => this._playIntro(), 400);
  }

  _build() {
    const text = this.el.textContent.trim();
    this.el.innerHTML = '';
    this.chars = [...text].map(ch => {
      const s = document.createElement('span');
      s.style.cssText = 'display:inline-block;white-space:pre;';
      s.textContent = ch;
      this.el.appendChild(s);
      return { el: s, target: ch, v: 0 };
    });
  }

  _rand() {
    const sc = this.o.scrambleChars;
    return sc[Math.floor(Math.random() * sc.length)];
  }

  _loop() {
    const decay = 1 / (60 * this.o.duration * this.o.trail);
    this.chars.forEach(c => {
      if (c.target === ' ') return;
      if (c.v > 0) {
        c.el.textContent = this._rand();
        c.v = Math.max(0, c.v - decay);
      } else {
        c.el.textContent = c.target;
      }
    });
    requestAnimationFrame(() => this._loop());
  }

  _trigger(c, delay = 0) {
    if (c.target === ' ') return;
    if (delay) setTimeout(() => { c.v = 1; }, delay);
    else c.v = 1;
  }

  _playIntro() {
    this.chars.forEach((c, i) => this._trigger(c, i * 80 * this.o.speed));
  }

  _bindEvents() {
    const burst = () => this.chars.forEach((c, i) => this._trigger(c, i * 40));
    if (this.o.clickBurst) {
      this.el.addEventListener('click', burst);
      this.el.addEventListener('touchstart', burst, { passive: true });
    }
    document.addEventListener('mousemove', e => {
      this.chars.forEach(c => {
        if (c.target === ' ') return;
        const r = c.el.getBoundingClientRect();
        const dist = Math.hypot(e.clientX - r.left - r.width / 2, e.clientY - r.top - r.height / 2);
        if (dist < this.o.radius) c.v = Math.min(1, c.v + 0.4);
      });
    });
  }
}
